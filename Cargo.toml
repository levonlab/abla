[package]
name = "abla"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Voice dictation for Linux. A floating button: click, talk, click again, and the text lands where your cursor is."
license = "MIT"
repository = "https://github.com/levongabrielyan/abla"
homepage = "https://github.com/levongabrielyan/abla"
readme = "README.md"
authors = ["Levon Gabrielyan"]
keywords = ["dictation", "speech-to-text", "wayland", "voice", "linux"]
categories = ["accessibility", "multimedia::audio", "gui"]

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
log = "0.4"
notify-rust = "4"
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
