name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    # Debian 13 is the oldest Debian family release that ships gtk4-layer-shell.
    container: debian:trixie
    steps:
      - name: Install GTK 4, gtk4-layer-shell and a C toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
